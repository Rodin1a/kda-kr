# ponytail: Docker Compose configuration for KDA.KR
services:
  kda-kr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kda-kr
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - .env.local
    networks:
      vlan:
        ipv4_address: 192.168.0.205

networks:
  vlan:
    external: true

